name: PettyLint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The Action ships dist/index.js, so it must match the sources.
      - name: Verify dist/ is up to date
        run: git diff --exit-code -- dist/
      - name: Verify the Action bundle actually loads
        run: node -e "process.env.GITHUB_TOKEN='ci-smoke-test'; try { require('./dist/index.js'); } catch (e) { if (!String(e.message).includes('pull_request')) throw e; }"

  pettylint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          fail-on: error
