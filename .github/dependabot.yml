version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-toolkit:
        patterns: ["@actions/*"]
      dev-tooling:
        patterns: ["vitest", "tsx", "@vercel/ncc", "@types/*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
